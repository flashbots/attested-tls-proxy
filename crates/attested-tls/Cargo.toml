[package]
name = "attested-tls"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A remote-attested TLS protocol for secure communication with CVM services"
repository = "https://github.com/flashbots/attested-tls-proxy"
keywords = ["attested-TLS", "CVM", "TDX"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-rustls.workspace = true
sha2 = "0.10.9"
x509-parser = { workspace = true, features = ["verify"] }
thiserror.workspace = true
webpki-roots.workspace = true
http.workspace = true
serde_json.workspace = true
tracing.workspace = true
parity-scale-codec = "3.7.5"
attestation = { git = "https://github.com/flashbots/attested-tls", branch = "main" }

# Used for websocket support
tokio-tungstenite = { version = "0.28.0", optional = true }
futures-util = { version = "0.3.31", optional = true }

# Used for JSON RPC support
alloy-rpc-client = { version = "1.1.3", optional = true }
tower-service = { version = "0.3.3", optional = true }
alloy-transport-http = { version = "1.4.3", features = ["hyper"], optional = true }
url = { version = "2.5.7", optional = true }
hyper = { workspace = true, features = ["client", "http2"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }

# Used for self-signed certificates and test helpers
rcgen.workspace = true

[dev-dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tempfile.workspace = true
attestation = { git = "https://github.com/flashbots/attested-tls", branch = "main", features = ["mock"] }

[features]
default = []

# Adds support for Microsoft Azure attestation generation and verification
azure = ["attestation/azure"]

# Adds websocket support
ws = ["tokio-tungstenite", "futures-util"]

# Adds JSON RPC support
rpc = [
  "alloy-rpc-client",
  "tower-service",
  "alloy-transport-http",
  "url",
  "hyper",
  "hyper-util",
  "bytes",
  "http-body-util",
  "futures-util",
]

# Exposes helper functions for testing - do not enable in production as this allows dangerous configuration
test-helpers = ["attestation/mock"]

mock = ["attestation/mock"]
