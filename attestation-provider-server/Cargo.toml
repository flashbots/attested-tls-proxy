[package]
name = "attestation-provider-server"
description = "An HTTP server which provides attestations"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/flashbots/attested-tls-proxy"

[dependencies]
attested-tls-proxy = { path = ".." }
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8.9"
clap = { version = "4.5.51", features = ["derive", "env"] }
anyhow = "1.0.100"
bytes = "1.11.1"
hex = "0.4.3"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = "1.7.0"
hyper-util = { version = "0.1.17", features = ["tokio"] }
tokio-vsock = { version = "0.7.2", features = ["axum08"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
parity-scale-codec = "3.7.5"
reqwest = { version = "0.12.23", default-features = false }
