[workspace]
members = [".", "attested-tls", "tcp-tunnel"]

[workspace.dependencies]
anyhow = "1.0.100"
attestation = { git = "https://github.com/flashbots/attested-tls", branch = "main" }
attested-tls = { path = "attested-tls", default-features = false }
bytes = "1.11.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
h2 = "0.4.12"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http2"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
rcgen = "0.14.5"
rustls-pemfile = "2.2.0"
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-rustls = { version = "0.26.4", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
webpki-roots = "1.0.4"

[package]
name = "attested-tls-proxy"
version = "1.1.1"
edition = "2024"
license = "MIT"
description = "An HTTP attested TLS proxy server and client for secure communication with CVM services"
repository = "https://github.com/flashbots/attested-tls-proxy"
keywords = ["attested-TLS", "CVM", "TDX"]

[dependencies]
attested-tls = { workspace = true, features = ["self-signed"] }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
thiserror.workspace = true
clap.workspace = true
rustls-pemfile.workspace = true
anyhow.workspace = true
pem-rfc7468 = { version = "0.7.0", features = ["std"] }
hyper = { workspace = true, features = ["server"] }
h2.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
http.workspace = true
serde_json.workspace = true
serde = "1.0.228"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls-no-provider",
] }
webpki-roots.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8.8"
tower-http = { version = "0.6.7", features = ["fs"] }
pin-project-lite = "0.2.16"
pccs = { git = "https://github.com/flashbots/attested-tls", branch = "main" }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
rcgen.workspace = true
tempfile.workspace = true
tdx-quote = { version = "0.0.5", features = ["mock"] }
attested-tls = { workspace = true, default-features = true, features = ["test-helpers", "mock"] }
jsonrpsee = { version = "0.26.0", features = ["server"] }

[features]
default = []

# Adds support for Microsoft Azure attestation generation and verification
azure = ["attested-tls/azure"]

[package.metadata.deb]
maintainer = "Flashbots Team <devops+ci@flashbots.net>"
depends = "$auto"
section = "network"
priority = "optional"
maintainer-scripts = "pkg/debian"
assets = [
    [
        "target/reproducible/attested-tls-proxy",
        "usr/bin/",
        "755",
    ],
    [
        "LICENSE",
        "usr/share/doc/attested-tls-proxy/",
        "644",
    ],
]
systemd-units = { enable = false, start = false, unit-name = "attested-tls-proxy" }

[profile.reproducible]
inherits = "release"
lto = "thin"
panic = "abort"
incremental = false
