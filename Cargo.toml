[workspace]
members = ["crates/attested-tls", "crates/attested-tls-proxy"]
default-members = ["crates/attested-tls-proxy"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.100"
bytes = "1.11.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
h2 = "0.4.12"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = "1.7.0"
hyper-util = "0.1.17"
rcgen = "0.14.5"
rustls-pemfile = "2.2.0"
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-rustls = { version = "0.26.4", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
webpki-roots = "1.0.4"
x509-parser = "0.18.0"

[profile.reproducible]
inherits = "release"
lto = "thin"
panic = "abort"
incremental = false
