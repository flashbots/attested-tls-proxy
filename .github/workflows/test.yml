name: Test

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check attested-tls with default features
      run: cargo check -p attested-tls --locked

    - name: Run cargo clippy
      run: cargo clippy --workspace --features attested-tls/ws --locked -- -D warnings

    - name: Run cargo test
      run: cargo test --workspace --features attested-tls/ws --all-targets --locked -- --test-threads=1

  dependency_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install dependency checks
      id: install_checks
      run: cargo install --locked cargo-audit@0.22.1 cargo-deny@0.22.0

    - name: Run cargo audit
      run: cargo audit --file Cargo.lock

    - name: Run cargo deny
      if: ${{ !cancelled() && steps.install_checks.outcome == 'success' }}
      run: cargo deny --locked --features attested-tls/ws check bans licenses sources
